<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420">

  <rect width="1400" height="420" fill="#000000"/>

  <style>

    .bit {
      font-family: monospace;
      font-size: 18px;
      font-weight: bold;
    }

    .verde {
      fill: #2CFF05;
    }

    .roxo {
      fill: #FF00FF;
    }

    .fraco {
      opacity: 0.18;
      font-size: 12px;
    }

    .medio {
      opacity: 0.45;
      font-size: 15px;
    }

    .forte {
      opacity: 0.9;
      font-size: 22px;
      font-weight: bold;
    }

    /* CHUVA */

    .c1  { animation: cair 4.2s linear infinite; }
    .c2  { animation: cair 5.8s linear infinite; }
    .c3  { animation: cair 3.7s linear infinite; }
    .c4  { animation: cair 6.2s linear infinite; }
    .c5  { animation: cair 4.8s linear infinite; }
    .c6  { animation: cair 3.9s linear infinite; }
    .c7  { animation: cair 5.1s linear infinite; }
    .c8  { animation: cair 6.5s linear infinite; }
    .c9  { animation: cair 4.4s linear infinite; }
    .c10 { animation: cair 5.6s linear infinite; }
    .c11 { animation: cair 3.5s linear infinite; }
    .c12 { animation: cair 6.8s linear infinite; }
    .c13 { animation: cair 4.1s linear infinite; }
    .c14 { animation: cair 5.3s linear infinite; }
    .c15 { animation: cair 3.8s linear infinite; }
    .c16 { animation: cair 6.1s linear infinite; }
    .c17 { animation: cair 4.7s linear infinite; }
    .c18 { animation: cair 5.9s linear infinite; }
    .c19 { animation: cair 3.6s linear infinite; }
    .c20 { animation: cair 6.4s linear infinite; }
    .c21 { animation: cair 4.5s linear infinite; }
    .c22 { animation: cair 5.5s linear infinite; }
    .c23 { animation: cair 3.9s linear infinite; }
    .c24 { animation: cair 6.7s linear infinite; }
    .c25 { animation: cair 4.3s linear infinite; }
    .c26 { animation: cair 5.2s linear infinite; }
    .c27 { animation: cair 3.7s linear infinite; }
    .c28 { animation: cair 6.3s linear infinite; }

    @keyframes cair {
      from {
        transform: translateY(-420px);
      }

      to {
        transform: translateY(420px);
      }
    }

    /* NOME */

    .nome {
      font-family: monospace;
      font-size: 72px;
      font-weight: 900;
      letter-spacing: 10px;
      fill: #FFFFFF;
      stroke: #FFFFFF;
      stroke-width: 1;
    }

    .brilho {
      font-family: monospace;
      font-size: 72px;
      font-weight: 900;
      letter-spacing: 10px;
      fill: #FF00FF;
      opacity: 0.35;
      filter: blur(10px);
    }

    .linha {
      fill: #FF00FF;
    }

  </style>


