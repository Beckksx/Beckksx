<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <rect width="1200" height="300" fill="#000000"/>

  <style>
    text {
      font-family: monospace;
      font-size: 18px;
      font-weight: bold;
      fill: #FF00FF;
    }

    .coluna1 { animation: queda1 4s linear infinite; }
    .coluna2 { animation: queda2 5s linear infinite; }
    .coluna3 { animation: queda3 3.5s linear infinite; }
    .coluna4 { animation: queda4 6s linear infinite; }
    .coluna5 { animation: queda5 4.5s linear infinite; }
    .coluna6 { animation: queda6 3s linear infinite; }
    .coluna7 { animation: queda7 5.5s linear infinite; }
    .coluna8 { animation: queda8 4s linear infinite; }
    .coluna9 { animation: queda9 6.5s linear infinite; }
    .coluna10 { animation: queda10 3.8s linear infinite; }

    @keyframes queda1 {
      from { transform: translateY(-320px); }
      to { transform: translateY(320px); }
    }

    @keyframes queda2 {
      from { transform: translateY(-420px); }
      to { transform: translateY(300px); }
    }

    @keyframes queda3 {
      from { transform: translateY(-250px); }
      to { transform: translateY(350px); }
    }

    @keyframes queda4 {
      from { transform: translateY(-500px); }
      to { transform: translateY(300px); }
    }

    @keyframes queda5 {
      from { transform: translateY(-350px); }
      to { transform: translateY(330px); }
    }

    @keyframes queda6 {
      from { transform: translateY(-280px); }
      to { transform: translateY(350px); }
    }

    @keyframes queda7 {
      from { transform: translateY(-450px); }
      to { transform: translateY(320px); }
    }

    @keyframes queda8 {
      from { transform: translateY(-300px); }
      to { transform: translateY(350px); }
    }

    @keyframes queda9 {
      from { transform: translateY(-550px); }
      to { transform: translateY(300px); }
    }

    @keyframes queda10 {
      from { transform: translateY(-380px); }
      to { transform: translateY(350px); }
    }
  </style>

