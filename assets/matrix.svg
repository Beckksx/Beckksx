  <g class="coluna4" opacity=".5">
    <text class="codigo" x="400" y="0">011010</text>
    <text class="codigo" x="400" y="30">101101</text>
    <text class="codigo" x="400" y="60">010010</text>
    <text class="codigo" x="400" y="90">110101</text>
    <text class="codigo" x="400" y="120">001111</text>
    <text class="codigo" x="400" y="150">101010</text>
  </g>

  <g class="coluna5" opacity=".8">
    <text class="codigo" x="520" y="0">101011</text>
    <text class="codigo" x="520" y="30">010101</text>
    <text class="codigo" x="520" y="60">110010</text>
    <text class="codigo" x="520" y="90">001101</text>
    <text class="codigo" x="520" y="120">111010</text>
    <text class="codigo" x="520" y="150">010011</text>
  </g>

  <g class="coluna6" opacity=".45">
    <text class="codigo" x="640" y="0">001011</text>
    <text class="codigo" x="640" y="30">110101</text>
    <text class="codigo" x="640" y="60">010110</text>
    <text class="codigo" x="640" y="90">101001</text>
    <text class="codigo" x="640" y="120">011101</text>
    <text class="codigo" x="640" y="150">111010</text>
  </g>

  <g class="coluna7" opacity=".8">
    <text class="codigo" x="760" y="0">111001</text>
    <text class="codigo" x="760" y="30">010101</text>
    <text class="codigo" x="760" y="60">101110</text>
    <text class="codigo" x="760" y="90">001011</text>
    <text class="codigo" x="760" y="120">110101</text>
    <text class="codigo" x="760" y="150">010010</text>
  </g>

  <g class="coluna8" opacity=".5">
    <text class="codigo" x="880" y="0">010011</text>
    <text class="codigo" x="880" y="30">101101</text>
    <text class="codigo" x="880" y="60">110010</text>
    <text class="codigo" x="880" y="90">001101</text>
    <text class="codigo" x="880" y="120">111010</text>
    <text class="codigo" x="880" y="150">010110</text>
  </g>

  <g class="coluna9" opacity=".8">
    <text class="codigo" x="1000" y="0">101010</text>
    <text class="codigo" x="1000" y="30">011101</text>
    <text class="codigo" x="1000" y="60">110011</text>
    <text class="codigo" x="1000" y="90">001100</text>
    <text class="codigo" x="1000" y="120">101101</text>
    <text class="codigo" x="1000" y="150">010010</text>
  </g>

  <!-- BRILHO DO NOME -->

  <text class="brilho" x="600" y="190" text-anchor="middle">
    Beckksx
  </text>

  <!-- NOME -->

  <text class="nome" x="600" y="190" text-anchor="middle">
    Beckksx
  </text>

  <!-- LINHA NEON -->

  <rect x="360" y="215" width="480" height="2" fill="#FF00FF"/>

  <text
    x="600"
    y="250"
    text-anchor="middle"
    fill="#FFFFFF"
    font-family="monospace"
    font-size="13"
    letter-spacing="5">
    NÚCLEO DIGITAL // SISTEMA ONLINE
  </text>

</svg>
